<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found | Akash Raj</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23171819'/%3E%3Ctext x='32' y='42' font-family='Courier New,monospace' font-size='26' font-weight='bold' fill='%23FA7575' text-anchor='middle'%3EAR%3C/text%3E%3C/svg%3E">
<!-- Absolute paths on purpose. This file is served for any unmatched URL, so at
     /blog/typo a relative "styles.css?v=11" would resolve to /blog/styles.css and the
     error page would arrive unstyled and without the rain. -->
<link rel="stylesheet" href="/styles.css?v=11">

<!-- Match the saved colour theme before first paint, the same way every other
     page does. Without this the 404 ignored the reader's chosen theme. -->
<script>
  (function () {
    /* Marks that scripting is available, before first paint. The scroll-reveal
       styles are scoped to html.js so that a script failure cannot leave the
       page invisible. */
    document.documentElement.className += " js";
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    } catch (e) { /* storage blocked, fall back to system preference */ }
  })();
</script>
</head>
<body class="rain-quiet">
<canvas id="matrixRain" aria-hidden="true"></canvas>
<main id="main">
  <div class="wrap pad-lead-lg">
    <h1>404</h1>
    <p class="role">Page not found</p>
    <p class="lede">
      That page isn't here. The link is broken or the page moved, but nothing is wrong with your connection.
    </p>
    <p class="contact-line">
      <a href="/">Home</a>
      <span class="sep">|</span>
      <a href="https://www.linkedin.com/in/akashraj235" target="_blank" rel="noopener me">LinkedIn</a>
      <span class="sep">|</span>
      <a href="/resume/Akash_Raj_Resume.pdf" download>Resume (PDF)</a>
    </p>
  </div>
</main>

<script src="/matrix.js?v=11" defer></script>
</body>
</html>
